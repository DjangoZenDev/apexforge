<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — ApexForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 600: '#059669', 700: '#047857' }
          },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex items-center justify-center">
  <div class="text-center px-6 max-w-md">
    <div class="text-7xl mb-6">📡</div>
    <h1 class="text-3xl font-bold mb-3">You're Offline</h1>
    <p class="text-gray-400 mb-8 leading-relaxed">
      It looks like you've lost your internet connection.
      Check your network and try again — or continue viewing cached pages.
    </p>
    <div class="flex gap-3 justify-center">
      <button onclick="window.location.reload()"
              class="inline-flex items-center gap-2 rounded-xl bg-primary-600 px-5 py-3 text-sm font-semibold text-white hover:bg-primary-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Try Again
      </button>
      <button onclick="history.back()"
              class="inline-flex items-center gap-2 rounded-xl border border-gray-600 bg-gray-700 px-5 py-3 text-sm font-semibold text-gray-200 hover:bg-gray-600 transition-colors">
        ← Go Back
      </button>
    </div>
    <p class="mt-8 text-xs text-gray-600">ApexForge — Sports Management Platform</p>
  </div>
</body>
</html>
