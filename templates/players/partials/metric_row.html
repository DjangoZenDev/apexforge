{% load i18n %}
<tr class="border-b border-gray-100 dark:border-gray-700">
  <td class="py-2 pr-4 text-sm font-medium text-gray-900 dark:text-white">{{ metric.key }}</td>
  <td class="py-2 pr-4 text-sm text-gray-700 dark:text-gray-300">
    {{ metric.value }}{% if metric.unit %} <span class="text-gray-400 text-xs">{{ metric.unit }}</span>{% endif %}
  </td>
  <td class="py-2 pr-4 text-xs text-gray-400">{{ metric.recorded_at|date:"j M Y" }}</td>
  <td class="py-2 text-xs text-gray-400">{{ metric.season|default:"—" }}</td>
</tr>
