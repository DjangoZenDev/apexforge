<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block subject %}ApexForge{% endblock %}</title>
  <style>
    body { margin:0; padding:0; background:#f3f4f6; font-family: 'Inter', Arial, sans-serif; }
    .wrapper { max-width:600px; margin:32px auto; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.08); }
    .header { background:linear-gradient(135deg,#059669,#047857); padding:32px 40px; }
    .header h1 { margin:0; color:#ffffff; font-size:22px; font-weight:700; }
    .header p  { margin:4px 0 0; color:#a7f3d0; font-size:13px; }
    .body { padding:32px 40px; }
    .body h2 { margin:0 0 12px; font-size:18px; color:#111827; }
    .body p  { margin:0 0 16px; font-size:14px; color:#374151; line-height:1.6; }
    .alert-box { border-radius:10px; padding:16px 20px; margin:20px 0; }
    .alert-box.danger  { background:#fef2f2; border-left:4px solid #ef4444; }
    .alert-box.warning { background:#fffbeb; border-left:4px solid #f59e0b; }
    .alert-box.info    { background:#eff6ff; border-left:4px solid #3b82f6; }
    .alert-box.success { background:#f0fdf4; border-left:4px solid #22c55e; }
    .alert-box p { margin:0; font-size:13px; }
    table.data { width:100%; border-collapse:collapse; margin:16px 0; }
    table.data th { background:#f9fafb; padding:10px 14px; text-align:left; font-size:11px; text-transform:uppercase; color:#6b7280; letter-spacing:.05em; }
    table.data td { padding:10px 14px; font-size:13px; color:#374151; border-top:1px solid #f3f4f6; }
    table.data tr:hover td { background:#f9fafb; }
    .btn { display:inline-block; padding:12px 28px; background:#059669; color:#ffffff; text-decoration:none; border-radius:10px; font-size:14px; font-weight:600; margin:8px 0; }
    .btn:hover { background:#047857; }
    .footer { background:#f9fafb; padding:20px 40px; text-align:center; font-size:12px; color:#9ca3af; border-top:1px solid #f3f4f6; }
    .footer a { color:#059669; text-decoration:none; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
    .badge-red    { background:#fee2e2; color:#dc2626; }
    .badge-amber  { background:#fef3c7; color:#d97706; }
    .badge-green  { background:#dcfce7; color:#16a34a; }
    .badge-gray   { background:#f3f4f6; color:#6b7280; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>⚡ ApexForge</h1>
    <p>Sports Management Platform</p>
  </div>
  <div class="body">
    {% block body %}{% endblock %}
  </div>
  <div class="footer">
    <p>© ApexForge · <a href="#">Unsubscribe</a> · You received this because you manage a club on ApexForge.</p>
  </div>
</div>
</body>
</html>
