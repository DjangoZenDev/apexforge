{% load i18n %}
<a id="cart-badge"
   href="{% url 'finance:cart' %}"
   title="{% trans 'My Cart' %}"
   class="relative p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">
  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
  </svg>
  {% if cart and cart.item_count > 0 %}
  <span class="absolute -top-0.5 -right-0.5 h-4 w-4 rounded-full bg-accent-500 text-white text-xs flex items-center justify-center font-bold leading-none">
    {{ cart.item_count }}
  </span>
  {% endif %}
</a>
