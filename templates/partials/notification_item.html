{% load i18n %}
<li id="notif-{{ notification.pk }}"
    class="flex gap-3 px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors opacity-60">
  <span class="mt-0.5 h-2 w-2 rounded-full shrink-0
               {% if notification.level == 'success' %}bg-emerald-500
               {% elif notification.level == 'warning' %}bg-amber-500
               {% elif notification.level == 'error' %}bg-red-500
               {% else %}bg-blue-500{% endif %}"></span>
  <div class="flex-1 min-w-0">
    <p class="text-sm font-medium text-gray-500 dark:text-gray-400 truncate">{{ notification.title }}</p>
    <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">{{ notification.message|truncatechars:80 }}</p>
    <p class="text-xs text-gray-400 mt-1">{{ notification.created_at|timesince }} {% trans "ago" %}</p>
  </div>
</li>
