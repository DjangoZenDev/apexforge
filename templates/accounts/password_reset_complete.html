{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Password Reset Complete" %}{% endblock %}
{% block public_content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 p-4">
  <div class="text-center">
    <div class="inline-flex h-16 w-16 rounded-full bg-emerald-100 dark:bg-emerald-900/30 items-center justify-center mb-6">
      <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">{% trans "Password updated!" %}</h1>
    <p class="text-gray-500">{% trans "Your password has been set. You can now sign in." %}</p>
    <a href="{% url 'accounts:login' %}" class="btn-primary inline-flex mt-6">{% trans "Sign in" %}</a>
  </div>
</div>
{% endblock %}
